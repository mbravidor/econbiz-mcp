[project]
name = "econbiz-mcp"
version = "0.2.0"
description = "MCP server for the EconBiz API (https://api.econbiz.de/)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "mbravidor" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
econbiz-mcp = "econbiz_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econbiz_mcp"]

[project.urls]
Repository = "https://github.com/mbravidor/econbiz-mcp"
